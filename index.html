<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliyan Hadi - Developer Portfolio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --hover-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .stats {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .repo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .repo-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            background-color: var(--hover-bg);
        }

        .repo-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .repo-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .repo-footer {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f1e05a; /* Default JS yellow */
            display: inline-block;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="user-name">Aliyan Hadi</h1>
        <p class="bio" id="user-bio">
            Visual Sanctuary. Curating contemporary menswear aesthetics, dark romanticism, and poetic geometry. Principal digital storefront developer.
        </p>
        <p class="stats">Repositories (<span id="repo-count">12</span>)</p>
    </header>

    <main class="repo-grid" id="repo-container">
        <!-- Repositories render dynamically -->
    </main>

    <footer>
        <p>&copy; 2026 Aliyan Hadi. Hosted on GitHub Pages.</p>
    </footer>
</div>

<script>
    // Config: Update with your active GitHub username
    const GITHUB_USERNAME = "aliyanhadi"; // Change to your active new account handle

    // List of your 12 repositories
    const repositories = [
        { name: "systempulse", desc: "System performance monitoring and diagnostics dashboard." },
        { name: "FocusDesk", desc: "Workspace productivity and focus management utility." },
        { name: "jarvis-3d-holographic-media-hub", desc: "3D interactive media hub visualizer interface." },
        { name: "cyber-matrix-dashboard", desc: "Cyberpunk-themed matrix UI dashboard." },
        { name: "Taskdash", desc: "Streamlined task management and workflow dashboard." },
        { name: "register", desc: "User registration and authentication framework." },
        { name: "affiliate-pin-publisher", desc: "Automated affiliate pin publishing engine." },
        { name: "gatepass-parking", desc: "Parking management and security gatepass tracking system." },
        { name: "Jarvis-AI-for-Fitness", desc: "AI-driven workout and fitness tracking assistant." },
        { name: "Google-AI-Studio", desc: "Custom integrations and prompt pipelines for Google AI Studio." },
        { name: "tokforge-legal", desc: "Legal documentation and terms suite for TokForge." },
        { name: "instagram_auto-leads", desc: "Automation tool for Instagram lead generation." }
    ];

    const container = document.getElementById('repo-container');

    repositories.forEach(repo => {
        const card = document.createElement('a');
        card.className = 'repo-card';
        card.href = `https://github.com/${GITHUB_USERNAME}/${repo.name}`;
        card.target = '_blank';

        card.innerHTML = `
            <div>
                <div class="repo-title">${repo.name}</div>
                <div class="repo-desc">${repo.desc}</div>
            </div>
            <div class="repo-footer">
                <span class="lang-dot"></span> JavaScript / Python
            </div>
        `;
        container.appendChild(card);
    });
</script>

</body>
</html>
